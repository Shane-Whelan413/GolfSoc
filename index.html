<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0a1a0a;color:#fff;overflow-x:hidden}

.bg{
  position:fixed;inset:0;z-index:0;
  background-image:url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?w=1400&q=85&fit=crop&crop=center');
  background-size:cover;background-position:center 45%;
}
.bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(8,20,8,0.7) 0%,
    rgba(8,20,8,0.45) 25%,
    rgba(8,20,8,0.55) 55%,
    rgba(8,20,8,0.92) 80%,
    rgba(8,20,8,0.98) 100%
  );
}

.page{
  position:relative;z-index:2;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:max(env(safe-area-inset-top,0px),40px) 24px max(env(safe-area-inset-bottom,0px),28px);
  gap:0;
}

/* ── Logo ── */
.logo-section{
  display:flex;flex-direction:column;align-items:center;
  gap:10px;margin-bottom:auto;padding-top:8px;
  animation:fadeUp .7s ease both;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.logo-svg{width:88px;height:88px;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5))}
.logo-name{
  font-family:'DM Serif Display',serif;
  font-size:38px;letter-spacing:-0.01em;line-height:1;
  text-shadow:0 2px 20px rgba(0,0,0,0.6);
}
.logo-name em{font-style:normal;color:#52b788}
.logo-tagline{
  font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(255,255,255,0.4);margin-top:2px;
}

/* ── Hero ── */
.hero-section{
  text-align:center;margin:auto 0;padding:24px 0;
  animation:fadeUp .7s .15s ease both;
}
.we-are{
  font-size:clamp(18px,5vw,24px);font-weight:800;letter-spacing:0.18em;
  text-transform:uppercase;color:rgba(255,255,255,0.9);
  text-shadow:0 2px 12px rgba(0,0,0,0.5);margin-bottom:2px;
}
.coming-soon-text{
  font-size:clamp(46px,14vw,80px);font-weight:800;letter-spacing:-0.02em;
  line-height:0.95;text-transform:uppercase;
  text-shadow:0 4px 24px rgba(0,0,0,0.5);
  margin-bottom:0;
}
.coming-soon-text em{font-style:normal;color:#52b788}

/* Divider triangle */
.divider{
  display:flex;flex-direction:column;align-items:center;gap:0;
  margin:16px 0;
}
.divider-line{width:60px;height:1px;background:rgba(201,168,76,0.6)}
.divider-tri{
  width:0;height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:8px solid rgba(201,168,76,0.6);
  margin-top:-1px;
}

/* ── Features ── */
.features{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:0;width:100%;max-width:420px;
  border:1px solid rgba(255,255,255,0.15);border-radius:14px;
  overflow:hidden;backdrop-filter:blur(10px);
  background:rgba(0,0,0,0.2);
  animation:fadeUp .7s .3s ease both;
}
.feat{
  display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:16px 6px 14px;
  border-right:1px solid rgba(255,255,255,0.1);
}
.feat:last-child{border-right:none}
.feat-icon{width:28px;height:28px;color:#52b788;flex-shrink:0}
.feat-label{
  font-size:8.5px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;color:rgba(255,255,255,0.65);
  text-align:center;line-height:1.3;
}

/* ── CTA pill ── */
.cta-section{
  width:100%;max-width:400px;margin-top:20px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:fadeUp .7s .45s ease both;
}

.tagline-pill{
  display:inline-flex;align-items:center;
  border:1.5px solid rgba(82,183,136,0.5);
  border-radius:99px;padding:12px 24px;
  font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  color:rgba(255,255,255,0.85);
  background:rgba(82,183,136,0.08);backdrop-filter:blur(8px);
  text-align:center;line-height:1.3;
}

.email-form{width:100%;display:flex;flex-direction:column;gap:8px}
.email-input{
  width:100%;padding:14px 18px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);
  color:#fff;font-size:16px;font-family:'DM Sans',sans-serif;
  outline:none;-webkit-appearance:none;transition:border-color .2s;
}
.email-input::placeholder{color:rgba(255,255,255,0.3)}
.email-input:focus{border-color:#52b788}
.email-btn{
  width:100%;padding:15px;border-radius:12px;border:none;
  background:#52b788;color:#071407;
  font-size:15px;font-weight:800;font-family:'DM Sans',sans-serif;
  cursor:pointer;-webkit-appearance:none;
  transition:opacity .2s,transform .1s;letter-spacing:0.02em;
}
.email-btn:active{transform:scale(0.98);opacity:0.9}
.success-msg{
  display:none;width:100%;
  background:rgba(82,183,136,0.12);border:1px solid rgba(82,183,136,0.35);
  border-radius:12px;padding:14px 18px;
  font-size:14px;font-weight:600;color:#52b788;text-align:center;
}

.social{font-size:12px;color:rgba(255,255,255,0.3);margin-top:4px}
.social a{color:rgba(255,255,255,0.55);text-decoration:none;font-weight:600}

/* ── Secret gear button ── */
#secret-btn{
  display:none;position:fixed;
  bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  right:20px;z-index:999;
}
#secret-btn a{
  display:flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:50%;
  background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.35);
  backdrop-filter:blur(10px);text-decoration:none;font-size:22px;
  color:rgba(201,168,76,0.8);
  transition:opacity .3s;
}
#secret-btn.show{display:block;animation:fadeIn .3s ease}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>

      <input class="email-input" type="email" id="email-input" placeholder="Enter your email for early access" autocomplete="email">
      <button class="email-btn" onclick="submitEmail()">Get Early Access</button>
    </div>
    <div class="success-msg" id="success-msg">You're on the list! We'll be in touch soon.</div>
    <div class="social">
  <a href="mailto:hello@golfsoc.ie">hello@golfsoc.ie</a> &nbsp;·&nbsp; Follow us <a href="https://instagram.com/golfsoc" target="_blank">@golfsoc</a>
</div>
  </div>

</div>

<!-- Secret gear — tap logo 5x to reveal, links to real landing page -->
<div id="secret-btn">
  <a href="landing.html">⚙</a>
</div>

<script>
var taps = 0, tapTimer;
document.getElementById('logo-tap').addEventListener('click', function() {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(function(){ taps = 0; }, 2500);
  if (taps >= 5) {
    taps = 0;
    var btn = document.getElementById('secret-btn');
    btn.classList.add('show');
    setTimeout(function(){ btn.classList.remove('show'); }, 10000);
  }
});

function submitEmail() {
  var val = document.getElementById('email-input').value.trim();
  if (!val || !val.includes('@')) {
    document.getElementById('email-input').style.borderColor = '#ef4444';
    setTimeout(function(){ document.getElementById('email-input').style.borderColor = ''; }, 1500);
    return;
  }
  var list = JSON.parse(localStorage.getItem('gs_waitlist')||'[]');
  list.push({ email: val, ts: new Date().toISOString() });
  localStorage.setItem('gs_waitlist', JSON.stringify(list));
  document.getElementById('email-form').style.display = 'none';
  document.getElementById('success-msg').style.display = 'block';
}
</script>
</body>
</html>
